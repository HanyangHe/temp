name: Unpack PhDN archive
on:
  push:
    branches: [chatgpt-unpack-feynman]
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Stage-0 selection code
        run: |
          mkdir -p inspection
          {
            echo '=== run_phdn_per_output_pysr_stage0.m ==='
            grep -nEi 'merge_inner_restart_results_local|structureScore|machineError|pysrScore|native.*score|bestScore|selected.*score|selectionPolicy' unpacked/core/stage0/run_phdn_per_output_pysr_stage0.m || true
            echo '=== train_official_pysr_baseline.m ==='
            grep -nEi 'structureScore|machineError|pysrScore|native.*score|bestScore|selected.*score|selectionPolicy|outputSelections' unpacked/baselines/sr/train_official_pysr_baseline.m || true
            echo '=== pysr_official_adapter.py ==='
            grep -nEi 'structure_score|machine.*error|pysr.*score|native.*score|best_score|selected.*score|selection_policy|model_selection' unpacked/baselines/sr/pysr_official_adapter.py || true
            echo '=== defaults ==='
            grep -nEi 'structureScore|machineError|modelSelection|selectionPolicy' unpacked/core/phdnn_default_options.m unpacked/baselines/sr/sr_default_options.m || true
          } > inspection/selection_grep.txt
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection
          git commit -m "Add Stage-0 selection inspection report" || exit 0
          git push
