name: Unpack PhDN archive
on:
  push:
    branches: [chatgpt-unpack-feynman]
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack archive and Live Scripts
        run: |
          rm -rf unpacked mlx_unpacked
          mkdir -p unpacked mlx_unpacked
          unzip -q PHDNN_LSQ_Framework_v75_PySR2_shared_initial_guesses_full.zip -d unpacked
          for f in unpacked/run_demo_feynman_dimless.mlx unpacked/run_demo_single_generator_dynamic.mlx unpacked/run_demo_soft_saturated_lorenz96.mlx; do
            if [ -f "$f" ]; then
              b=$(basename "$f" .mlx)
              mkdir -p "mlx_unpacked/$b"
              unzip -q "$f" -d "mlx_unpacked/$b" || true
            fi
          done
          find mlx_unpacked -type f | head -200
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unpacked mlx_unpacked
          git commit -m "Extract Live Script internals for inspection" || exit 0
          git push
