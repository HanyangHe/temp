name: Build Feynman update
on:
  push:
    branches: [chatgpt-unpack-feynman]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate updated files
        run: |
          python -c "from pathlib import Path; p=Path('tools/apply_feynman_update.py'); s=p.read_text(encoding='utf-8'); a=s.index('# Verify extracted code corresponds to XML code paragraphs'); b=s.index(\"tree.write(doc,encoding='UTF-8',xml_declaration=True)\"); rep=\"# Live Editor stores the script inside code paragraph payloads with embedded newlines.\\nscript_paras=[q for q in root.iter(f'{{{W}}}p') if is_code(q)]\\nif not script_paras: raise RuntimeError('No MATLAB code paragraph found in Live Script XML.')\\nprimary=next((q for q in script_paras if '%% Demo: SINDy bypass' in ptext(q)), max(script_paras,key=lambda q:len(ptext(q))))\\nsettext(primary,main)\\nfor q in script_paras:\\n    if q is not primary and ptext(q).strip(): parent[q].remove(q)\\n\"; p.write_text(s[:a]+rep+s[b:],encoding='utf-8')"
          python tools/apply_feynman_update.py
          python -m py_compile deliverables/baselines/sr/pysr_official_adapter.py
          unzip -t deliverables/run_demo_feynman_dimless.mlx
          grep -R -n "selectionPolicy\|RunOriginalPySRScoreBaseline\|displayRecordReport_PySROriginalScore" deliverables --exclude='*.mlx' | head -100
          zip -qr Feynman_original_PySR_score_update.zip deliverables
      - name: Commit deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+HanyangHe@users.noreply.github.com"
          git add deliverables Feynman_original_PySR_score_update.zip
          git commit -m "Build Feynman original PySR score update" || exit 0
          git push
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Feynman_original_PySR_score_update
          path: Feynman_original_PySR_score_update.zip
